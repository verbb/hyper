<nav class="hyper-settings-tabs">
    <ul>
        {% for itemId, item in craft.hyper.settingsNavItems %}
            {% if item.heading is defined %}
                <li class="heading"><span>{{ item.heading }}</span></li>
            {% else %}
                <li>
                    <a href="{{ item.url }}"{% if selectedTab == itemId %} class="sel"{% endif %}>
                        {{ item.title }}
                    </a>
                </li>
            {% endif %}
        {% endfor %}
    </ul>
</nav>
